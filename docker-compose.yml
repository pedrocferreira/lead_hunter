services:
  leadsapp:
    build: .
    container_name: leadsapp_container
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    shm_size: "1gb"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - USE_REAL_CRAWLER=${USE_REAL_CRAWLER:-true}
      - CRAWLER_TIMEOUT=${CRAWLER_TIMEOUT:-30000}
      - CRAWLER_MAX_RESULTS=${CRAWLER_MAX_RESULTS:-15}
      - GROQ_API_KEY=${GROQ_API_KEY:-}

